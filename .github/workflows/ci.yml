name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release
        env:
          Supabase__Url: ${{ secrets.SUPABASE_DEV_URL }}
          Supabase__ServiceRoleKey: ${{ secrets.SUPABASE_DEV_SERVICE_KEY }}
          OpenFoodFacts__BaseUri: "https://world.openfoodfacts.net"

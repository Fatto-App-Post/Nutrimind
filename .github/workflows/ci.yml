name: CI

on:
  push:
    branches: [main, develop, claude_code]
  pull_request:

# Questo repository contiene lo schema del database (SQL) e le Edge
# Functions (Deno). Il backend .NET non esiste più: il workflow
# precedente eseguiva `dotnet build` e `dotnet test` su progetti
# cancellati e quindi falliva a ogni push.
#
# Qui si verifica solo quello che si può verificare senza un progetto
# Supabase: che le migration siano SQL valido e che le funzioni siano
# TypeScript valido. Applicare le migration a un Postgres vuoto non
# funzionerebbe: dipendono da `auth`, da `auth.uid()` e dalle estensioni
# che installa Supabase.

jobs:
  migrations:
    name: Le migration sono SQL valido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa il parser di PostgreSQL
        run: npm install --no-save libpg-query@17
      - name: Analizza ogni file .sql
        run: node scripts/check-sql.mjs

  functions:
    name: Le Edge Functions sono TypeScript valido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa esbuild
        run: npm install --no-save esbuild@0.25.0
      - name: Analizza ogni funzione
        run: node scripts/check-functions.mjs
